<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="assets/css/style.css"><script type="module" src="assets/js/master.js"></script><title>Jugadores - League Rayo de Luna</title></head><body><header><img src="images/logo.png" class="logosize" alt="Logo"><h1>Jugadores</h1><img src="images/logoliga.png" class="logosize6x6" alt="Liga"></header><div class="container"><nav></nav><main><section id="loginSection"><h2 class="nuffle red centered">Iniciar sesión</h2><form class="formulario" id="formLogin"><label for="username">Usuario</label><input id="username" required><label for="password">Contraseña</label><input id="password" type="password" required><button>Entrar</button></form><div id="loginMensaje"></div></section><section id="masterSection" class="hide"><button id="logoutButton" class="master-action">Cerrar sesión</button><h2 class="nuffle red centered">Inscripción</h2><form class="formulario" id="formInscripcion"><label>Torneo</label><select id="torneoInscripcion" required></select><label>Raza</label><select id="razaInscripcion" required></select><label>Nombre del equipo</label><input id="nombreEquipo" required><button>Inscribirse</button></form><div id="inscripcionMensaje"></div><h2 class="nuffle red centered">Subir resultado</h2><form class="formulario" id="formResultado"><label>Partido</label><select id="partidoResultado" required></select><label>TD A</label><input id="touchdownsA" type="number" min="0" required><label>TD B</label><input id="touchdownsB" type="number" min="0" required><label>Bajas A</label><input id="bajasA" type="number" min="0" required><label>Bajas B</label><input id="bajasB" type="number" min="0" required><button>Enviar resultado</button></form><div id="resultadoMensaje"></div><h2 class="nuffle red centered">Clasificación</h2><div class="formulario"><label>Torneo</label><select id="torneoClasificacion"></select></div><div id="clasificacionMensaje"></div><div id="clasificacionContenedor" class="hide classification-scroll"><table id="tablaClasificacion"><thead><tr><th>Pos.</th><th>Jugador</th><th>Raza</th><th>Partidos</th><th>PG</th><th>PE</th><th>PP</th><th>Pts</th><th>TD +/-</th><th>Bajas +/-</th></tr></thead><tbody></tbody></table></div><h2 class="nuffle red centered">Resultados</h2><div class="formulario"><label>Torneo</label><select id="torneoResultados"></select></div><div id="resultadosTorneoMensaje"></div><div id="resultadosTorneoContenedor" class="hide classification-scroll"><table id="tablaResultadosTorneo"><thead><tr><th>Ronda</th><th>Jugador A</th><th>TD</th><th>Bajas</th><th>TD</th><th>Bajas</th><th>Jugador B</th></tr></thead><tbody></tbody></table></div><h2 class="nuffle red centered">Subir roster</h2><form class="formulario" id="formRoster"><label>Torneo</label><select id="inscripcionRoster" required></select><label>PDF</label><input id="archivoRoster" type="file" accept="application/pdf,.pdf" required><button>Subir roster</button></form><div id="rosterMensaje"></div><h2 class="nuffle red centered">Ver rosters</h2><div class="formulario"><label>Torneo</label><select id="torneoRosters"></select></div><div id="rostersMensaje"></div><div class="classification-scroll"><table id="tablaRosters"><thead><tr><th>Torneo</th><th>Jugador</th><th>Equipo</th><th>Archivo</th><th>Fecha</th><th>Descargar</th></tr></thead><tbody></tbody></table></div></section></main></div></body></html>
