<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro - League Rayo de Luna</title>
	<link rel="stylesheet" href="assets/css/style.css">
	<!-- commons.js (que importa registroNew.js) carga el menú lateral -->
	<script type="module" src="assets/js/registroNew.js"></script>
</head>
<body>
	<header>
		<img src="images/logo.png" class="logosize" alt="Logo">
		<h1>Registro</h1>
		<img src="images/logoliga.png" class="logosize6x6" alt="Liga">
	</header>
	<div class="container">
		<nav>
			<div id="menu-container"></div>
			<img src="images/numuno.PNG" class="sideimg" alt="numuno">
		</nav>
		<main>
			<h2 class="nuffle red centered">Registrar usuario</h2>
			<form class="formulario" id="formRegistroPublico">
				<label for="username">Alias</label>
				<input id="username" type="text" autocomplete="username" required>
				<label for="email">Email</label>
				<input id="email" type="email" autocomplete="email" required>
				<label for="password">Contraseña</label>
				<input id="password" type="password" autocomplete="new-password" minlength="6" required>
				<label for="passwordConfirmacion">Repetir contraseña</label>
				<input id="passwordConfirmacion" type="password" autocomplete="new-password" minlength="6" required>
				<button type="submit">Registrarse</button>
			</form>
			<div id="registroMensaje"></div>
		</main>
	</div>
</body>
</html>
