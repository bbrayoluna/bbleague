<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="assets/js/menuNew.js"></script>
<script type="module" src="assets/js/indexNew.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Rayo de Luna</title>
</head>
<body>
	<header>
		<img src="images/logo.png" class="logosize" alt="LogoBB">
		<h1>League Rayo de Luna</h1>
		<img src="images/logoliga.png" class="logosize6x6" alt="logoliga">
	</header>
	<div class="container">
		<nav>
			<div id="menu-container"></div>
			<img src="images/numuno.PNG" class="sideimg" alt="numuno">
		</nav>
		<main>
			<section id="loginSection">
				<h2 class="nuffle red centered">Login</h2>
				<form class="formulario" id="formLogin">
					<label for="username">Usuario</label>
					<input id="username" type="text" autocomplete="username" required>
					<label for="password">Contraseña</label>
					<input id="password" type="password" autocomplete="current-password" required>
					<button type="submit">Entrar</button>
				</form>
				<p id="loginMensaje" class="centered"></p>
			</section>
		</main>
	</div>
</body>
</html>
