<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="assets/css/style.css"><script type="module" src="assets/js/master.js"></script><title>Master - League Rayo de Luna</title></head><body><header><img src="images/logo.png" class="logosize" alt="Logo"><h1>Master</h1><img src="images/logoliga.png" class="logosize6x6" alt="Liga"></header><div class="container"><nav></nav><main><section id="loginSection"><h2 class="nuffle red centered">Iniciar sesión</h2><form class="formulario" id="formLogin"><label for="username">Usuario</label><input id="username" required><label for="password">Contraseña</label><input id="password" type="password" required><button>Entrar</button></form><div id="loginMensaje"></div></section><section id="masterSection" class="hide"><button id="logoutButton" class="master-action">Cerrar sesión</button><h2 class="nuffle red centered">Crear torneo</h2><form class="formulario" id="formTorneo"><label for="nombreTorneo">Nombre</label><input id="nombreTorneo" required><label for="anoTorneo">Año</label><input id="anoTorneo" type="number" min="2000" max="2100" required><fieldset id="rondasTorneo"><legend>Rondas</legend><div class="ronda-form"><h3>Ronda 1</h3><label>Inicio</label><input type="date" data-field="start-date" required><label>Fin</label><input type="date" data-field="end-date" required></div></fieldset><button type="button" id="anadirRonda" class="master-action">Añadir ronda</button><button>Crear torneo</button></form><div id="mensaje"></div><h2 class="nuffle red centered">Gestionar torneo</h2><form class="formulario" id="formGestionTorneo"><label for="torneoGestion">Torneo</label><select id="torneoGestion" required></select><div id="estadoTorneo"></div><button type="button" id="abrirInscripciones" class="master-action">Abrir inscripciones</button><button type="button" id="cerrarInscripciones" class="master-action">Cerrar inscripciones</button><button type="button" id="finalizarTorneo" class="master-action">Finalizar torneo</button></form><div id="gestionMensaje"></div><h2 class="nuffle red centered">Añadir partido</h2><form class="formulario" id="formPartido"><label>Ronda</label><select id="rondaPartido" required></select><label>Jugador A</label><select id="jugadorAPartido" required></select><label>Jugador B</label><select id="jugadorBPartido" required></select><button>Añadir partido</button></form><div id="partidoMensaje"></div></section></main></div></body></html>
