<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="assets/js/master.js"></script>
<script type="module" src="assets/js/menu.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master - League Rayo de Luna</title>
</head>
<body>
  <header>
    <img src="images/logo.png" class="logosize" alt="LogoBB">
    <h1>Master</h1>
    <img src="images/logoliga.png" class="logosize6x6" alt="logoliga">
  </header>
  <div class="container">
    <nav>
      <div id="menu-container"></div>
      <img src="images/members.jpeg" class="sideimg" alt="Master">
    </nav>
    <main>
      <section id="loginSection">
        <h2 class="nuffle red centered">Iniciar sesión</h2>
        <form class="formulario" id="formLogin">
          <label for="username">Usuario</label>
          <input type="text" id="username" autocomplete="username" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>

          <button type="submit">Entrar</button>
        </form>
        <div id="loginMensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Registrar usuario</h2>
        <form class="formulario" id="formRegistroUsuario">
          <label for="registroUsername">Alias</label>
          <input type="text" id="registroUsername" maxlength="50" required>

          <label for="registroEmail">Email</label>
          <input type="email" id="registroEmail" autocomplete="email" required>

          <label for="registroPassword">Contraseña</label>
          <input type="password" id="registroPassword" minlength="6" autocomplete="new-password" required>

          <label for="registroPasswordConfirmacion">Repetir contraseña</label>
          <input type="password" id="registroPasswordConfirmacion" minlength="6" autocomplete="new-password" required>

          <button type="submit">Registrar usuario</button>
        </form>
        <div id="registroMensaje" class="centered" aria-live="polite"></div>
      </section>

      <section id="masterSection" class="hide">
        <div class="centered">
          <button type="button" class="master-action" id="logoutButton">Cerrar sesión</button>
        </div>
        <h2 class="nuffle red centered">Crear torneo</h2>

        <form class="formulario" id="formTorneo">
          <label for="nombreTorneo">Nombre del torneo</label>
          <input type="text" id="nombreTorneo" name="name" maxlength="120" required>

          <label for="anoTorneo">Año</label>
          <input type="number" id="anoTorneo" name="year" min="2000" max="2100" required>

          <fieldset id="rondasTorneo">
            <legend>Rondas</legend>
            <div class="ronda-form" data-ronda="1">
              <h3>Ronda 1</h3>
              <label for="inicioRonda1">Fecha de inicio</label>
              <input type="date" id="inicioRonda1" name="inicioRonda1" data-field="start-date" required>

              <label for="finRonda1">Fecha de fin</label>
              <input type="date" id="finRonda1" name="finRonda1" data-field="end-date" required>
            </div>
          </fieldset>

          <button type="button" class="master-action" id="anadirRonda">Añadir ronda</button>

          <button type="submit">Crear torneo</button>
        </form>

        <div id="mensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Inscribirse en un torneo</h2>
        <form class="formulario" id="formInscripcion">
          <label for="torneoInscripcion">Torneo</label>
          <select id="torneoInscripcion" required></select>

          <label for="razaInscripcion">Raza</label>
          <select id="razaInscripcion" required></select>

          <label for="nombreEquipo">Nombre del equipo</label>
          <input type="text" id="nombreEquipo" maxlength="100" required>

          <button type="submit">Inscribirse</button>
        </form>
        <div id="inscripcionMensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Subir resultado</h2>
        <form class="formulario" id="formResultado">
          <label for="partidoResultado">Partido</label>
          <select id="partidoResultado" required></select>

          <label for="touchdownsA">Touchdowns A</label>
          <input type="number" id="touchdownsA" min="0" required>

          <label for="touchdownsB">Touchdowns B</label>
          <input type="number" id="touchdownsB" min="0" required>

          <label for="bajasA">Bajas A</label>
          <input type="number" id="bajasA" min="0" required>

          <label for="bajasB">Bajas B</label>
          <input type="number" id="bajasB" min="0" required>

          <button type="submit">Enviar resultado</button>
        </form>
        <div id="resultadoMensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Añadir partido</h2>
        <form class="formulario" id="formPartido">
          <label for="rondaPartido">Ronda</label>
          <select id="rondaPartido" required></select>

          <label for="jugadorAPartido">Jugador A</label>
          <select id="jugadorAPartido" required></select>

          <label for="jugadorBPartido">Jugador B</label>
          <select id="jugadorBPartido" required></select>

          <button type="submit">Añadir partido</button>
        </form>
        <div id="partidoMensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Clasificación</h2>
        <div class="formulario">
          <label for="torneoClasificacion">Torneo</label>
          <select id="torneoClasificacion">
            <option value="">Selecciona un torneo</option>
          </select>
        </div>
        <div id="clasificacionMensaje" class="centered" aria-live="polite"></div>
        <div id="clasificacionContenedor" class="hide classification-scroll">
          <table id="tablaClasificacion">
            <thead>
              <tr>
                <th>Pos.</th>
                <th>Jugador</th>
                <th>Raza</th>
                <th>Partidos</th>
                <th>PG</th>
                <th>PE</th>
                <th>PP</th>
                <th>Pts</th>
                <th>TD +/-</th>
                <th>Bajas +/-</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <h2 class="nuffle red centered">Subir roster</h2>
        <form class="formulario" id="formRoster">
          <label for="inscripcionRoster">Torneo</label>
          <select id="inscripcionRoster" required></select>

          <label for="archivoRoster">Archivo PDF</label>
          <input type="file" id="archivoRoster" accept="application/pdf,.pdf" required>

          <button type="submit">Subir roster</button>
        </form>
        <div id="rosterMensaje" class="centered" aria-live="polite"></div>

        <h2 class="nuffle red centered">Descargar rosters</h2>
        <div class="formulario">
          <label for="torneoRosters">Filtrar por torneo</label>
          <select id="torneoRosters">
            <option value="">Todos los torneos</option>
          </select>
        </div>
        <div id="rostersMensaje" class="centered" aria-live="polite"></div>
        <div id="rostersContenedor" class="classification-scroll">
          <table id="tablaRosters">
            <thead>
              <tr>
                <th>Torneo</th>
                <th>Jugador</th>
                <th>Equipo</th>
                <th>Archivo</th>
                <th>Fecha</th>
                <th>Descargar</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
