<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Master - League Rayo de Luna</title>
	<link rel="stylesheet" href="assets/css/style.css">
	<!-- commons.js (que importa master.js) carga el menú lateral y la sesión -->
	<script type="module" src="assets/js/master.js"></script>
</head>
<body>
	<header>
		<img src="images/logo.png" class="logosize" alt="Logo">
		<h1>Master</h1>
		<img src="images/logoliga.png" class="logosize6x6" alt="Liga">
	</header>
	<div class="container">
		<nav>
			<div id="menu-container"></div>
			<img src="images/numuno.PNG" class="sideimg" alt="numuno">
		</nav>
		<main>
			<section id="loginSection">
				<h2 class="nuffle red centered">Iniciar sesión</h2>
				<form class="formulario" id="formLogin">
					<label for="username">Usuario</label>
					<input id="username" type="text" autocomplete="username" required>
					<label for="password">Contraseña</label>
					<input id="password" type="password" autocomplete="current-password" required>
					<button type="submit">Entrar</button>
				</form>
				<div id="loginMensaje"></div>
			</section>
			<section id="masterSection" class="hide">
				<h2 class="nuffle red centered">Crear torneo</h2>
				<form class="formulario" id="formTorneo">
					<label for="nombreTorneo">Nombre</label>
					<input id="nombreTorneo" required>
					<label for="anoTorneo">Año</label>
					<input id="anoTorneo" type="number" min="2000" max="2100" required>
					<fieldset id="rondasTorneo">
						<legend>Rondas</legend>
						<div class="ronda-form">
							<h3>Ronda 1</h3>
							<label for="inicioRonda1">Fecha de inicio</label>
							<input type="date" id="inicioRonda1" data-field="start-date" required>

							<label for="finRonda1">Fecha de fin</label>
							<input type="date" id="finRonda1" data-field="end-date" required>
						</div>
					</fieldset>
					<button type="button" id="anadirRonda" class="master-action">Añadir ronda</button>
					<button type="submit">Crear torneo</button>
				</form>
				<div id="mensaje"></div>

				<h2 class="nuffle red centered">Gestionar torneo</h2>
				<form class="formulario" id="formGestionTorneo">
					<label for="torneoGestion">Torneo</label>
					<select id="torneoGestion" required></select>
					<div id="estadoTorneo"></div>
					<button type="button" id="abrirInscripciones" class="master-action">Abrir inscripciones</button>
					<button type="button" id="cerrarInscripciones" class="master-action">Cerrar inscripciones</button>
					<button type="button" id="finalizarTorneo" class="master-action">Finalizar torneo</button>
				</form>
				<div id="gestionMensaje"></div>

				<h2 class="nuffle red centered">Añadir partido</h2>
				<form class="formulario" id="formPartido">
					<label for="torneoPartido">Torneo</label>
					<select id="torneoPartido" required></select>
					<label for="rondaPartido">Ronda</label>
					<select id="rondaPartido" required></select>
					<label for="jugadorAPartido">Jugador A</label>
					<select id="jugadorAPartido" required></select>
					<label for="jugadorBPartido">Jugador B</label>
					<select id="jugadorBPartido" required></select>
					<button type="submit">Añadir partido</button>
				</form>
				<div id="partidoMensaje"></div>

				<h2 class="nuffle red centered">Bases del torneo</h2>
				<form class="formulario" id="formBasesTorneo">
					<label for="torneoBases">Torneo</label>
					<select id="torneoBases" required></select>
					<label for="archivoBases">Archivo PDF</label>
					<input id="archivoBases" type="file" accept="application/pdf,.pdf" required>
					<button type="submit">Subir bases</button>
				</form>
				<div id="basesMensaje"></div>
			</section>
		</main>
	</div>
</body>
</html>
