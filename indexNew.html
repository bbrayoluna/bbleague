<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>League Rayo de Luna</title>
	<link rel="stylesheet" href="assets/css/style.css">
	<!-- commons.js (que importa index.js) carga el menú lateral y la sesión -->
	<script type="module" src="assets/js/index.js"></script>
</head>
<body>
	<header>
		<img src="images/logo.png" class="logosize" alt="LogoBB">
		<h1>League Rayo de Luna</h1>
		<img src="images/logoliga.png" class="logosize6x6" alt="logoliga">
	</header>
	<div class="container">
		<nav>
			<div id="menu-container"></div>
			<img src="images/Designer.png" class="sideimg" alt="Designer">
		</nav>
		<main>
			<section id="loginSection">
				<h2 class="nuffle red centered">Login</h2>
				<form class="formulario" id="formLogin">
					<label for="username">Usuario</label>
					<input id="username" type="text" autocomplete="username" required>
					<label for="password">Contraseña</label>
					<input id="password" type="password" autocomplete="current-password" required>
					<button type="submit">Entrar</button>
				</form>
				<p id="loginMensaje" class="centered"></p>
			</section>
			<section class="home-content">
				<h2 class="nuffle red centered">Torneo LUNA NUEVA en curso</h2>
				<img
					class="home-poster"
					src="images/2026/Navidad/Equipos/CartelXmas26.jpg"
					alt="Cartel del torneo LUNA NUEVA de Navidad 2026">
				<h3 class="home-subtitle centered">Estos son los brutales equipos de esta temporada:</h3>
				<div class="team-gallery">
					<img src="images/2026/Navidad/Equipos/LogoSher.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/IMG-20260918-WA0004.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/IMG-20260918-WA0005.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/IMG-20260918-WA0006.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/IMG-20260918-WA0007.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/IMG-20260918-WA0009.jpg" alt="Equipo participante" loading="lazy">
					<img src="images/2026/Navidad/Equipos/CasacaEstirados.png" alt="Equipo participante" loading="lazy">
				</div>
			</section>
		</main>
	</div>
</body>
</html>
